<!DOCTYPE html>
<html>
<head>
    <title>NM Earthquake Data - Retrieved from RGIS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <script type="importmap">
        {
            "imports": {
            "maplibre-gl": "https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs",
            "@esri/maplibre-arcgis": "https://unpkg.com/@esri/maplibre-arcgis@1.3.1/dist/esm/maplibre-arcgis.min.js"
            }
        }
    </script>
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="module">
        import * as maplibregl from 'maplibre-gl';
        import * as maplibreArcGIS from '@esri/maplibre-arcgis';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-105.7918, 34.8365],
            zoom: 6,
            pitch: 0,
            bearing: 0
        });

       map.on('load', async () => {
        const ptService = "https://services9.arcgis.com/wb84GxCwiPzK3Eow/arcgis/rest/services/Lab01_Example__NM_Earthquakes/FeatureServer/0";
        const earthquakes = await maplibreArcGIS.FeatureLayer.fromUrl(ptService);

        earthquakes.addSourcesAndLayersTo(map);

        /*
        // To build custom styling, change the source call and add the layer
        earthquakes.addSourcesTo(map);
        
        map.addLayer({
                ...earthquakes.layer,
                type: 'circle',
                paint: {
                    'circle-radius': 6,
                    'circle-color': '#e25822',
                    'circle-stroke-width': 1,
                    'circle-stroke-color': '#ffffff'
                }   
            });
        */

        /*
        // To query the feature service, swap in this query
        
        const earthquakes = await maplibreArcGIS.FeatureLayer.fromUrl(ptService, {
                query: {
                     outFields: ['mag', 'depth', 'time'],
                    where: 'mag > 4'
                }
            });
        */
});
    </script>
</body>
</html>
