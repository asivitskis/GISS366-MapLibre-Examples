<!DOCTYPE html>
<html>
<head>
    <title>My Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-100, 40],
            zoom: 3,
            pitch: 0,
            bearing: 0
        });
        window.map = map;   // exposes map to the browser console for debugging

        /// Load simplified point layer of global populated locations from Natural Earth dataset.
        map.on('load', () => {
            map.addSource('cities', {
                type: 'geojson',
                data: 'https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_populated_places_simple.geojson'
            });

            map.addLayer({
                id: 'cities-points',
                type: 'circle',
                source: 'cities',
                paint: {
                    'circle-radius': 4,
                    'circle-color': '#007cbf'
                }
            });
        });
    </script>
</body>
</html>
